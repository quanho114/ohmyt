name: Build release archives
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npx tsc --noEmit
      - run: npm run release:check
      - run: npm run release:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install packaged smoke dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb bubblewrap libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Smoke packaged app
        if: runner.os == 'Linux'
        run: node release/testing/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: sky-${{ runner.os }}-${{ runner.arch }}
          path: |
            output/release/artifacts/sky-*.tar.gz
            output/release/artifacts/sky-*.zip
            output/release/artifacts/SHA256SUMS
            output/release/artifacts/build-info.json
          if-no-files-found: error
