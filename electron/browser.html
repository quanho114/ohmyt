<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>Trình duyệt ohmyt</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#363638;font:12px system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:inherit;cursor:pointer;flex-shrink:0;transition:background-color .15s,color .15s}button:hover{background:#f0f0f2;color:#171717}button:active{background:#e8e8eb}button:disabled{opacity:.3;cursor:default;background:transparent}button[hidden]{display:none}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}button:focus-visible{outline:2px solid #7998c2;outline-offset:-2px}
.tab-strip{display:flex;align-items:center;height:40px;padding:0 8px;border-bottom:1px solid #ededee;gap:4px}#tabs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;height:40px;overflow:auto;scrollbar-width:none}.tab{display:flex;align-items:center;gap:2px;min-width:100px;max-width:250px;height:30px;padding:0 4px 0 8px;border:1px solid transparent;border-radius:9px;color:#85858a;flex-shrink:0}.tab.selected{background:#fff;border-color:#e8e8eb;color:#303034;box-shadow:0 1px 2px #00000004}.select-tab{justify-content:flex-start;gap:7px;min-width:0;flex:1;height:28px;padding:0;background:transparent!important}.tab-label{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.close-tab{width:24px;height:24px;border-radius:6px;opacity:0}.tab:hover .close-tab,.tab.selected .close-tab,.close-tab:focus-visible{opacity:1}.close-tab svg{width:12px;height:12px}.add-tab,#expand,#stop-computer,#browser-files{width:32px;height:32px;border-radius:8px}.add-tab{color:#85858a}#stop-computer{color:#9b4040}#stop-computer svg{width:14px;height:14px}#browser-files{position:relative}.status-dot{position:absolute;right:4px;bottom:4px;width:5px;height:5px;border-radius:50%;background:#b5b5bd;box-shadow:0 0 0 2px #fff}#browser-files[data-ready=true] .status-dot{background:#459371}
form{display:flex;align-items:center;gap:8px;padding:5px 10px;height:44px;border-bottom:1px solid #eeeeef}.navigation-controls{display:flex;align-items:center;gap:0;padding:0 2px;border:1px solid #eeeeef;border-radius:18px}.navigation-controls button{width:30px;height:30px;border-radius:50%}.navigation-controls button:last-child{border-left:0;border-radius:50%}.address-wrap{display:flex;align-items:center;gap:6px;flex:1;min-width:0;height:32px;border:1px solid #eaeaed;border-radius:18px;background:#fcfcfd;padding:0 8px 0 14px;box-shadow:0 1px 2px #00000003;transition:border-color .15s,background-color .15s}.address-wrap>svg{display:none}.address-wrap:focus-within{background:#fff;border-color:#9baec8}input{width:100%;min-width:0;border:0;outline:0;padding:0;color:#34343a;background:transparent;height:30px;font-size:12px}input:not(.editing){text-align:center;padding-left:26px}input::placeholder{color:#93939b}.go-button{width:26px;height:26px;border-radius:50%;color:#888;visibility:hidden}.address-wrap:focus-within .go-button{visibility:visible}
@media(prefers-color-scheme:dark){body{background:#242426;color:#ddd}.tab-strip,form{border-color:#353538}.tab.selected{background:#2c2c2f;border-color:#424247;color:#eee}button:hover{background:#3b3b40;color:#fff}.navigation-controls{border-color:#3c3c42}.address-wrap{background:#29292c;border-color:#414148}.address-wrap:focus-within{background:#303035}input{color:#eee}.status-dot{box-shadow:0 0 0 2px #242426}}
.toolbar-main :is(#stop-computer,#browser-files,#expand){visibility:hidden}.toolbar-actions #tabs,.toolbar-actions form{display:none}.toolbar-actions .tab-strip{justify-content:flex-end}
</style>
<div class="tab-strip"><div id="tabs" role="tablist" aria-label="Tab trình duyệt"></div><button id="stop-computer" type="button" title="Dừng điều khiển AI" aria-label="Dừng điều khiển AI" hidden><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button><button id="browser-files" type="button" title="File trình duyệt" aria-label="File trình duyệt" hidden><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M12 18v-6m-3 3 3-3 3 3"/></svg><span class="status-dot" aria-hidden="true"></span></button><button id="expand" type="button" title="Phóng to trình duyệt" aria-label="Phóng to trình duyệt" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button></div>
<form id="navigation">
 <div class="navigation-controls"><button type="button" id="back" title="Quay lại" aria-label="Quay lại"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M8 12h12"/></svg></button><button type="button" id="forward" title="Tiến tới" aria-label="Tiến tới"><svg viewBox="0 0 24 24"><path d="m10 6 6 6-6 6M16 12H4"/></svg></button><button type="button" id="reload" title="Tải lại" aria-label="Tải lại"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button></div>
 <div class="address-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c5 5 5 12 0 17-5-5-5-12 0-17"/></svg><input id="address" aria-label="Địa chỉ hoặc tìm kiếm" placeholder="Tìm kiếm hoặc nhập URL" spellcheck="false" autocomplete="off"><button class="go-button" type="submit" title="Mở địa chỉ hoặc tìm kiếm" aria-label="Mở địa chỉ hoặc tìm kiếm"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button></div>
</form><script src="browser-ui.js"></script></html>
