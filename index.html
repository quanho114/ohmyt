<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%2032%2032%22 width=%2232%22 height=%2232%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2318181a%22/><text x=%2216%22 y=%2221%22 font-family=%22system-ui,sans-serif%22 font-size=%2212%22 font-weight=%22700%22 fill=%22%23f2f2f3%22 text-anchor=%22middle%22>OT</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>ohmyt</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #101014;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #ffffff;
      }
    </style>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('ohmyt_appearance');
          var app = raw ? JSON.parse(raw) : {};
          var legacy = localStorage.getItem('ohmyt_theme') || localStorage.getItem('lobe_core_theme');
          var mode = app.themeMode || legacy || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = isDark ? 'dark' : 'light';
          if (app.accent) root.dataset.accent = app.accent;
          if (app.neutral) root.dataset.neutral = app.neutral;
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var bg = isDark ? '#101014' : '#ffffff';
          root.style.backgroundColor = bg;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
